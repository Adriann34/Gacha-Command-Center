<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Expedition icon, recreated from the in-game art with a transparent background:
       a dark slate disc + white location-marker glyph (diamond pin on a curved path). -->
  <circle cx="24" cy="24" r="22" fill="#3c4560" stroke="#5c6a88" stroke-width="2.5"/>
  <circle cx="24" cy="24" r="18.25" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
  <!-- ground / path curve the marker sits on -->
  <path d="M14.5 31.5 Q24 38.5 33.5 31.5" fill="none" stroke="#eef2f8" stroke-width="2.4" stroke-linecap="round"/>
  <!-- location pin -->
  <path d="M24 12.75 C18.75 12.75 14.9 16.55 14.9 21.2 C14.9 26 20.4 30.7 24 33.9 C27.6 30.7 33.1 26 33.1 21.2 C33.1 16.55 29.25 12.75 24 12.75 Z" fill="#eef2f8"/>
  <!-- diamond gem (punched through to the disc colour) -->
  <path d="M24 16.9 L27.7 21.1 L24 25.3 L20.3 21.1 Z" fill="#3c4560"/>
</svg>
